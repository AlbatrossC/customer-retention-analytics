# Sandbox Bank - Model 1 synthetic dataset configuration.
# Every tunable number in the generator lives here. No magic constants in Python.
# Spec: dataset/model_1_plan.md

dataset:
  n_customers: 10000
  n_snapshots: 6
  customer_id_prefix: "C"
  customer_id_start: 10000          # C10000 .. C19999
  snapshot_start: "2026-01-01"      # six monthly dates, 2026-01-01 .. 2026-06-01
  snapshot_freq_months: 1
  # Paths are relative to the repository root, not to this file.
  output_csv: "data/model_1_training_data/customers.csv"
  responsiveness_csv: "data/model_1_training_data/responsiveness.csv"
  complaint_texts_json: "data/model_1_training_data/complaint_texts.json"
  float_precision: 4                # rounding for float columns, keeps the CSV stable

seed:
  master: 42
  # One named stream per attribute. Append new names to the END only:
  # spawn order defines the stream, so adding a column here does not shift
  # any draw made by an existing column.
  streams:
    - segment
    - age
    - tenure
    - name
    - yearly_value
    - loyalty
    - products
    - drift_state
    - baseline
    - behaviour_noise
    - behaviour_trend
    - farmer_season
    - balance_change_30d
    - transaction_change_30d
    - card_spend_change_30d
    - app_login_change_30d
    - external_transfer_change_30d
    - days_since_last_transaction
    - salary_missing_days
    - upi_share_of_spend
    - fd_maturing
    - products_dropped
    - decoy_branch
    - decoy_card
    - label_coin
    - label_unexplained
    - label_latent_service
    - service_complaints
    - service_failed
    - service_resolution
    - service_emi
    - service_text
    - responsiveness
    - split
    - service_shock

faker:
  locale: "en_IN"
  seed: 42

profiles:
  min_banking_age: 18               # hard rule: tenure_months / 12 <= age - min_banking_age
  segments:
    salary:
      share: 0.35
      age_min: 24
      age_max: 55
      income_regularity: "regular"
      tenure_mean_months: 72        # medium
      tenure_sd_months: 40
      yearly_value_mu: 10.6         # lognormal mu, natural log scale
      yearly_value_sigma: 0.55
      credit_card_p: 0.45
      loan_p: 0.30
    pension:
      share: 0.20
      age_min: 58
      age_max: 80
      income_regularity: "regular"
      tenure_mean_months: 150       # long
      tenure_sd_months: 60
      yearly_value_mu: 10.0
      yearly_value_sigma: 0.50
      credit_card_p: 0.15
      loan_p: 0.08
    farmer:
      share: 0.20
      age_min: 30
      age_max: 65
      income_regularity: "seasonal"
      tenure_mean_months: 140       # long
      tenure_sd_months: 60
      yearly_value_mu: 9.8
      yearly_value_sigma: 0.65
      credit_card_p: 0.10
      loan_p: 0.55
    vendor:
      share: 0.15
      age_min: 25
      age_max: 55
      income_regularity: "irregular"
      tenure_mean_months: 34        # short
      tenure_sd_months: 22
      yearly_value_mu: 9.5
      yearly_value_sigma: 0.60
      credit_card_p: 0.12
      loan_p: 0.35
    business:
      share: 0.10
      age_min: 30
      age_max: 60
      income_regularity: "irregular"
      tenure_mean_months: 80        # medium
      tenure_sd_months: 45
      yearly_value_mu: 11.3
      yearly_value_sigma: 0.70
      credit_card_p: 0.60
      loan_p: 0.50
  tenure_min_months: 1
  yearly_value_min: 2000.0
  yearly_value_max: 900000.0
  loyalty_sd: 0.85                  # hidden per-customer term in the churn score
  products:
    extra_poisson_lambda: 0.45      # products_count = 1 + card + loan + Poisson(lambda)
    max_products: 8

decoys:
  branch_codes:
    prefix: "BR-"
    first: 101
    count: 40                       # BR-101 .. BR-140, uniform, pure noise
  card_colours: ["blue", "green", "silver", "gold", "black"]

behaviour:
  drift_states:
    stable: 0.70
    declining: 0.20
    improving: 0.10
  # Per-customer baseline, the customer's own normal, drawn once.
  baseline:
    days_since_last_transaction_mean: 6.0
    days_since_last_transaction_sd: 3.0
    days_since_last_transaction_min: 0
    days_since_last_transaction_max: 120
    upi_share_mean: 0.42
    upi_share_sd: 0.18
    salary_missing_days_mean: 0.6
    salary_missing_days_sd: 1.0
    salary_missing_days_max: 30
  # Hidden drift: a per-customer step applied cumulatively across the 6 snapshots,
  # so a declining customer gets progressively worse rather than one bad month.
  drift:
    stable:
      step_mean: 0.0
      step_sd: 0.05
    declining:
      step_mean: 0.42
      step_sd: 0.10
    improving:
      step_mean: -0.28
      step_sd: 0.08
  ar1_rho: 0.55                     # carry-over of the previous snapshot shock
  noise_sd: 0.35                    # sd of the innovation in the latent state
  # Latent state -> observed field: value = centre + slope * state + field noise.
  fields:
    balance_change_30d:
      centre: 4.0
      slope: -26.0
      noise_sd: 12.0
    transaction_change_30d:
      centre: 3.0
      slope: -24.0
      noise_sd: 12.0
    card_spend_change_30d:
      centre: 5.0
      slope: -28.0
      noise_sd: 16.0
    app_login_change_30d:
      centre: 4.0
      slope: -25.0
      noise_sd: 15.0
    external_transfer_change_30d:
      centre: 6.0
      slope: 34.0
      noise_sd: 22.0
  change_clip_min: -100.0
  change_clip_max: 300.0
  days_since_last_transaction_slope: 7.5   # days added per unit of latent state
  days_since_last_transaction_noise_sd: 2.5
  salary_missing_days_slope: 3.2
  salary_missing_days_noise_sd: 1.0
  upi_share_slope: 0.10
  upi_share_noise_sd: 0.05
  upi_share_min: 0.0
  upi_share_max: 1.0
  farmer_season:
    months: [1, 2]                  # calendar months of the lean season for farmers
    state_bump: 0.55                # pushes the latent state worse in season
    bump_sd: 0.15
  fd_maturing_p: 0.08               # about 8% of customer-snapshots
  products_dropped:
    lambda_base: 0.04
    lambda_per_state: 0.20          # worse latent state -> more products dropped
    max: 3

label:
  # Section 5.2 quotes -3.1 as "roughly a 5% base rate". That is the rate with
  # every other term at zero, but the score's other terms are positive on
  # average (days_since_last_transaction is never negative, drop percents are
  # one-sided), so -3.1 lands the overall rate near 0.12. Lowered until the
  # overall rate sits mid-band for acceptance check 2 (0.04 to 0.08).
  # Section 13 tuning: the first fit gave ROC-AUC 0.64, below the 0.70 floor, so
  # the churn weights were raised (2.5x the starting values) and base_logit was
  # solved back down to hold the overall rate at 0.06. Re-solved again after
  # churn was made absorbing, since truncation drops post-churn rows and moves
  # the overall rate.
  base_logit: -6.009
  weights:
    salary_missing_days: 0.2125     # NaN contributes 0
    balance_drop_percent: 0.0525
    card_spend_drop_percent: 0.0325
    days_since_last_transaction: 0.1075
    unresolved_complaints: 0.75     # service is generated after the label, see 5.4
    fd_maturing_in_30d: 1.125
    tenure_months_sqrt: -0.1375     # negative: long tenure protects
  unexplained_churn_rate: 0.015     # share of non-churners flipped to 1 at random,
                                    # drawn per row after the coin flip
  # Churn is absorbing. A customer who has gone dormant cannot be observed
  # transacting again next month, so once churn_flag fires their panel stops.
  # Without this the April label ("dormant over the next 30 days") is
  # contradicted by an active May row describing the same window.
  absorbing: true

service:
  # Ordering, and the direction of causation.
  #
  # Section 5.4 requires the service columns to be generated after churn_flag.
  # That is an ordering constraint, not a causal one - in reality complaints
  # cause churn, not the reverse. So a latent complaint pressure is drawn BEFORE
  # the label and enters the churn score (5.2), and the observed service columns
  # are then drawn AFTER the label, primarily from that same latent pressure.
  # Conditioning on churn_flag is kept deliberately weak: a feature drawn from
  # the label is leakage and would inflate ROC-AUC dishonestly.
  latent_pressure:
    lambda_base: 0.10
    lambda_per_state: 0.30          # a customer whose behaviour is decaying complains more
    max: 8
  second_pathway:
    # A distinct route into churn. Without this, every high-risk customer is a
    # declining-behaviour customer and stable/improving are indistinguishable.
    # A shocked customer whose behaviour is stable becomes a risk through service
    # failure and a maturing deposit instead, so their SHAP profile differs.
    share: 0.10                     # share of customers, drawn independently of drift
    allow_on_declining: true        # Fix 2. When false the shock is gated to stable and
                                    # improving customers only, which makes the two
                                    # pathways perfectly disjoint - unrealistic, and it
                                    # leaves Model 2 with only two separate stories to
                                    # tell. When true a declining customer can also take
                                    # a service shock, creating an overlap group.
    pressure_lambda: 6.5            # latent complaint pressure added at full ramp
    ramp_floor: 0.35                # ramp runs from this to 1.0 over the 6 snapshots
    fd_maturing_p: 0.45             # far likelier to be holding a maturing deposit
  observed:
    # Every observed column is a NOISY read of the latent pressure. None is a
    # deterministic function of it: counts go through Poisson and Binomial draws,
    # so unresolved_complaints cannot be inverted back to the latent term.
    complaints:
      lambda_base: 0.30             # baseline grumbling, unrelated to churn risk:
                                    # 5.4 wants a meaningful share of non-churners
                                    # to have complaints too
      lambda_per_latent: 0.85
      churn_bump: 0.10              # weak, see the note above
      max: 6
    unresolved:
      p_base: 0.15
      p_per_latent: 0.13
      churn_bump: 0.025
      p_max: 0.90
    failed_transactions:
      lambda_base: 0.55
      lambda_per_latent: 0.70
      lambda_per_state: 0.60
      churn_bump: 0.12
      max: 15
    resolution_hours:
      base_mean: 18.0
      per_unresolved: 12.0
      per_latent: 6.0
      sd: 12.0
      min: 1.0
      max: 240.0
      no_complaint_value: 0.0
    emi_bounce:
      # Only ever fires where has_loan == 1.
      p_base: 0.03
      p_per_latent: 0.055
      p_per_state: 0.06
      churn_bump: 0.015
      p_max: 0.60
  complaint_text:
    empty_value: ""
    categories:
      - upi_failure
      - atm_card
      - loan_emi
      - branch_service
      - fees_charges
      - rm_notes
    texts_per_category: 60
    category_weights:
      upi_failure: 0.26
      atm_card: 0.18
      loan_emi: 0.16
      branch_service: 0.16
      fees_charges: 0.16
      rm_notes: 0.08

interventions:
  actions:
    fee_waiver:
      base: 0.18
      low_value_bonus: 0.30         # customer_yearly_value below low_value_quantile
      fee_complaint_bonus: 0.22
    rm_call:
      base: 0.16
      high_tenure_bonus: 0.34       # tenure_months above high_tenure_months
    complaint_escalation:
      base: 0.14
      unresolved_bonus: 0.38        # unresolved_complaints > 0
    rate_offer:
      base: 0.15
      pension_bonus: 0.30
      deposit_heavy_bonus: 0.20     # fd_maturing_in_30d seen in any snapshot
    do_nothing:
      base: 0.15                    # baseline, roughly 0.15 for everyone
  low_value_quantile: 0.35
  high_tenure_months: 96
  noise_sd: 0.06                    # per-customer jitter on each responsiveness
  clip_min: 0.01
  clip_max: 0.95

split:
  train: 0.70
  validation: 0.15
  test: 0.15
  time_forward:
    train_snapshots: [1, 2, 3, 4]
    test_snapshot: 6

gate:
  # Section 13 check 10, the throwaway LightGBM fit.
  drop_columns:
    - customer_id
    - customer_name
    - snapshot_date
    - loyalty
    - customer_yearly_value
    - complaint_text
    - churn_flag
  target: "churn_flag"
  categorical_columns:
    - customer_segment
    - income_regularity
    - branch_code
    - card_colour
  lightgbm:
    n_estimators: 400
    learning_rate: 0.05
    num_leaves: 31
    scale_pos_weight: 15
    random_state: 42
    verbose: -1
  roc_auc_min: 0.70
  roc_auc_max: 0.95

checks:
  # Section 13 acceptance thresholds.
  # Churn is absorbing: once a customer's churn_flag fires, no further snapshots
  # are generated for them, so the panel is no longer a fixed 60,000 rows.
  max_snapshots_per_customer: 6
  min_snapshots_per_customer: 1
  max_churn_rows_per_customer: 1
  churn_rate_min: 0.04
  churn_rate_max: 0.08
  decoy_flatness_max_spread: 0.035  # max - min churn rate across decoy levels
  decoy_min_rows_per_level: 200     # levels thinner than this are ignored
  extreme_rate_min_rows: 50         # check 7 ignores very thin value groups
  declining_trend_min_fraction: 0.70  # share of declining customers that trend down
  trend_min_rows: 4                 # a truncated customer needs this many rows to judge a trend
  decoy_chi2_min_p: 0.01            # check 6 is a chi-square test of independence
